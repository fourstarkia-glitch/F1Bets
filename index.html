// Firebase
function initFB(){
  if(!FIREBASE_CONFIG)return false;
  try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);fbdb=firebase.database();return true;}
  catch(e){return false;}
}
function startSync(code){
  if(!fbdb&&!initFB()){alert("Firebase not configured.");return;}
  if(syncUnsub){syncUnsub();syncUnsub=null;}
  syncRoom=code;localStorage.setItem("f1_room",code);syncStatus="connecting";render();
  const ref=fbdb.ref("rooms/"+code);
  const h=ref.on("value",snap=>{
    syncStatus="on";const d=snap.val();
    if(d){S.bets=(d.bets||[]).map(b=>({...b,result:b.result??null}));S.players=d.players||S.players;S.defaultPts={...DEF_PTS,...(d.defaultPts||{})};}
    render();
  },()=>{syncStatus="off";render();});
  syncUnsub=()=>ref.off("value",h);
}
function leaveRoom(){if(syncUnsub){syncUnsub();syncUnsub=null;}syncRoom=null;syncStatus="off";localStorage.removeItem("f1_room");render();}

// Persist
function load(){
  try{const d=JSON.parse(localStorage.getItem("f1bt26")||"{}");S.bets=d.bets||[];S.players=d.players||S.players;S.defaultPts={...DEF_PTS,...(d.defaultPts||{})};}catch(e){}
  const r=localStorage.getItem("f1_room");if(r&&initFB())startSync(r);
}
function save(){
  const d={bets:S.bets,players:S.players,defaultPts:S.defaultPts};
  try{localStorage.setItem("f1bt26",JSON.stringify(d));}catch(e){}
  if(fbdb&&syncRoom)fbdb.ref("rooms/"+syncRoom).set(d).catch(()=>{});
}

// Helpers

const genCode=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const cat=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const race=id=>RACES.find(r=>r.id===id);
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const p2=n=>String(n).padStart(2,"0");
const isMulti=id=>cat(id).multi>0;
const opts=id=>{const o=cat(id).opts;return o==="drivers"?DRIVERS:o==="constructors"?CONSTRUCTORS:o==="yesno"?YESNO:null;};
const arr=v=>Array.isArray(v)?v.filter(Boolean):(v&&String(v).trim()?[String(v).trim()]:[]);
const hasPick=v=>Array.isArray(v)?v.length>0:!!(v&&String(v).trim());

// Results
const isMR=r=>r&&typeof r==="object"&&r.type==="multi";
const isSR=r=>r&&typeof r==="object"&&!r.type; // new single result {p1:bool,p2:bool}
const isSettled=b=>b.result!=null;
const p1pts=b=>{if(!b.result||b.result==="push")return 0;if(isMR(b.result))return b.result.p1Score;if(isSR(b.result))return b.result.p1?b.points:0;return b.result==="p1"?b.points:0;};
const p2pts=b=>{if(!b.result||b.result==="push")return 0;if(isMR(b.result))return b.result.p2Score;if(isSR(b.result))return b.result.p2?b.points:0;return b.result==="p2"?b.points:0;};
const mWin=r=>isMR(r)?(r.p1Score>r.p2Score?"p1":r.p2Score>r.p1Score?"p2":"tie"):null;
const winSide=b=>{if(!isSettled(b)||b.result==="push")return null;if(isMR(b.result))return mWin(b.result);if(isSR(b.result)){if(b.result.p1&&b.result.p2)return"both";if(b.result.p1)return"p1";if(b.result.p2)return"p2";return"push";}return b.result;};
const calcMS=(b,actual)=>{
  const ppp=cat(b.catId).ptsPerPick||b.ptsPerPick||0;
  const p1a=arr(b.p1Pick),p2a=arr(b.p2Pick);
  const p1c=p1a.filter(d=>actual.includes(d)).length,p2c=p2a.filter(d=>actual.includes(d)).length;
  return{p1Score:p1c*ppp,p2Score:p2c*ppp,p1correct:p1c,p2correct:p2c};
};

// Countdown
const nextRace=()=>RACES.find(r=>r.ts>Date.now())||null;
const fmtCd=ms=>{if(ms<=0)return{d:0,h:0,m:0,s:0};const t=Math.floor(ms/1000);return{d:Math.floor(t/86400),h:Math.floor((t%86400)/3600),m:Math.floor((t%3600)/60),s:t%60};};

// Stats
function stats(){
  const sett=S.bets.filter(b=>isSettled(b)&&b.result!=="push");
  const ws=b=>winSide(b);
  const p1w=sett.filter(b=>ws(b)==="p1"),p2w=sett.filter(b=>ws(b)==="p2");
  const bt=[...sett].sort((a,b)=>a.ts-b.ts);
  let streak="—";
  if(bt.length){
    const ls=ws(bt[bt.length-1]);let n=0;
    for(let i=bt.length-1;i>=0;i--){if(ws(bt[i])===ls)n++;else break;}
    const nm=ls==="p1"?S.players.p1:ls==="p2"?S.players.p2:"Tie";
    streak=n>1?`${nm} ×${n}`:nm;
  }
  const bestCat=side=>{
    const m={};sett.filter(b=>ws(b)===side).forEach(b=>{m[b.catId]=(m[b.catId]||0)+1;});
    const best=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
    return best?`${cat(best[0]).label} (${best[1]})`:"—";
  };
  const h2h=CATS.map(c=>{
    const cs=sett.filter(b=>b.catId===c.id);
    return{c,a:cs.filter(b=>ws(b)==="p1").length,b:cs.filter(b=>ws(b)==="p2").length,t:cs.length};
  }).filter(x=>x.t>0);
  return{total:sett.length,p1w:p1w.length,p2w:p2w.length,
    tp1:S.bets.reduce((s,b)=>s+p1pts(b),0),tp2:S.bets.reduce((s,b)=>s+p2pts(b),0),
    streak,bestCat,h2h,last10:bt.slice(-10)};
}

function exportTxt(){
  const {p1,p2}=S.players;
  const tp1=S.bets.reduce((s,b)=>s+p1pts(b),0),tp2=S.bets.reduce((s,b)=>s+p2pts(b),0);
  const sett=S.bets.filter(b=>isSettled(b)&&b.result!=="push"),pend=S.bets.filter(b=>!isSettled(b));
  let t=`F1 2026 BET TRACKER\n${"─".repeat(30)}\n${p1}: ${tp1}pts  |  ${p2}: ${tp2}pts\n${sett.length} settled · ${pend.length} pending\n\n`;
  if(sett.length){t+="SETTLED\n";[...sett].sort((a,b)=>b.ts-a.ts).forEach(b=>{
    if(isMR(b.result)){t+=`• ${b.description}\n  Actual: ${b.result.actual.join(", ")}\n  ${p1}: ${b.result.p1correct}/${arr(b.p1Pick).length}✓ +${b.result.p1Score}pts  ${p2}: ${b.result.p2correct}/${arr(b.p2Pick).length}✓ +${b.result.p2Score}pts\n`;}
    else{const w=b.result==="p1"?p1:p2;t+=`• ${b.description}\n  ${w} wins — ${b.result==="p1"?pickTxt(b.p1Pick):pickTxt(b.p2Pick)} (+${b.points}pts)\n`;}
    if(b.note)t+=`  💬 ${b.note}\n`;
  });t+="\n";}
  if(pend.length){t+="PENDING\n";[...pend].sort((a,b)=>b.ts-a.ts).forEach(b=>{
    t+=`• ${b.description}\n`;
    if(hasPick(b.p1Pick))t+=`  ${p1}: ${pickTxt(b.p1Pick)}\n`;
    if(hasPick(b.p2Pick))t+=`  ${p2}: ${pickTxt(b.p2Pick)}\n`;
    if(b.note)t+=`  💬 ${b.note}\n`;
  });}
  return t;
}

// Grid builder — cbPrefix is the start of the call e.g. "toggleMP('p1Pick','podium',"
// so the final onclick becomes: toggleMP('p1Pick','podium','Max Verstappen')
function driverGrid(drivers,sel,max,cbPrefix,cc){
  const atMax=sel.length>=max;
  return drivers.map(d=>{
    const isSel=sel.includes(d),dis=!isSel&&atMax;
    const sd=d.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
    return`<button type="button" class="driver-btn ${isSel?"sel-"+cc:dis?"maxed":""}" ${dis?"disabled":""} onclick="${cbPrefix}'${sd}')">${isSel?"✓ ":""}${esc(d)}</button>`;
  }).join("");
}
function mPicker(fk,catId,sel,color,cc,tfn){
  const max=cat(catId).multi,cnt=sel.length;
  return`<div class="multi-pick-section"><div class="multi-pick-header"><span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${color}">Up to ${max}</span><span class="mpc" style="background:${color}22;color:${color};border:1px solid ${color}55">${cnt}/${max}</span></div><div class="driver-grid">${driverGrid(DRIVERS,sel,max,`${tfn}('${fk}','${catId}',`,cc)}</div></div>`;
}

  else{
    let db=[...bets];
    if(S.view==="pending")db=bets.filter(b=>!isSettled(b));
    else if(S.view==="settled")db=bets.filter(b=>isSettled(b));
    else if(S.view==="race")db=S.raceFilter!=="all"?bets.filter(b=>b.race&&b.race.id===S.raceFilter):bets.filter(b=>b.race);
    else if(S.view==="season")db=bets.filter(b=>!b.race);
    const rf=S.view==="race"?`<div class="race-filter"><select onchange="setRF(this.value)"><option value="all">All Races</option>${RACES.map(r=>`<option value="${r.id}"${S.raceFilter===r.id?" selected":""}>${r.date} — ${r.name}${r.track?` · ${r.track}`:""}</option>`).join("")}</select></div>`:"";
    const cards=db.length===0?`<div class="empty"><div style="font-size:36px;margin-bottom:10px">🏎️</div><div style="font-size:16px">No bets here yet.</div><div style="font-size:13px;margin-top:4px">Hit + to add one!</div></div>`
      :db.map(b=>{
        const c=cat(b.catId),push=b.result==="push"||winSide(b)==="push",mr=isMR(b.result),ws=winSide(b);
        const bc=isSettled(b)?(push?"#333":ws==="both"?"#f5c51855":ws==="p1"?"#E8002D33":ws==="p2"?"#0090FF33":"#333"):"#222";
        const ptsH=push?`<div class="bet-pts" style="color:#555">—</div>`:mr?`<div class="multi-pts-col"><div class="mpt" style="color:#E8002D">+${p1pts(b)}pts</div><div class="mpt" style="color:#0090FF">+${p2pts(b)}pts</div></div>`:ws==="both"?`<div class="multi-pts-col"><div class="mpt" style="color:#E8002D">+${b.points}pts</div><div class="mpt" style="color:#0090FF">+${b.points}pts</div></div>`:isSettled(b)?`<div class="bet-pts" style="color:${ws==="p1"?"#E8002D":"#0090FF"}">+${b.points}pts</div>`:`<div class="bet-pts" style="color:#fff">${b.points}pts</div>`;
        return`<div class="bet-card" style="border:1px solid ${bc};opacity:${push?.5:1}">
          <div class="bet-card-inner">
            <div style="flex:1;min-width:0">
              <div class="bet-meta"><span>${c.emoji}</span><span class="bet-cat-label">${c.label}</span>${c.ptsPerPick?`<span class="ppp-tag">${c.ptsPerPick}pts/✓</span>`:""}${RISKY.has(b.catId)?`<span class="risky-tag">RISKY</span>`:""}${b.race?`<span class="bet-race-tag">${esc(b.race.name)}</span>`:""}</div>
              ${c.id==="custom"?`<p style="color:#ccc;font-size:14px;margin:0 0 8px;font-style:italic">${esc(b.description)}</p>`:""}
              ${renderPicks(b,pl)}
              ${b.note?`<div class="bet-note">💬 ${esc(b.note)}</div>`:""}
            </div>
            <div class="bet-right">${ptsH}
              <div class="bet-actions">
                ${!isSettled(b)?`<button class="settle-btn" style="background:#E8002D" onclick="openSettle('${b.id}')">Settle</button>`:""}
                <button class="edit-btn" onclick="openEdit('${b.id}')">✏️ Edit</button>
                <button class="delete-btn" onclick="delBet('${b.id}')">Delete</button>
              </div>
            </div>
          </div>
        </div>`;
      }).join("");
    content=rf+`<div class="bet-list">${cards}</div>`;
  }
  document.getElementById("app").innerHTML=`
    <div class="header">
      <div class="header-top">
        <div><div style="display:flex;align-items:center;gap:10px;margin-bottom:2px"><span class="f1-badge">F1</span><span class="season-label">2026 SEASON</span></div><h1>BET TRACKER</h1></div>
        <div class="bet-count"><div>${bets.length} total bets</div><div>${pend} pending · ${sett} settled</div>
          <div class="header-btns">
            <button class="hbtn" onclick="openSync()"><span class="sync-dot ${sdot}"></span>${syncRoom||"Sync"}</button>
            <button class="hbtn" onclick="openExport()">📤</button>
            <button class="hbtn" onclick="openSettings()">⚙</button>
          </div>
        </div>
      </div>
      <div class="scoreboard">
        <div class="score-col">${p1NH}<div class="score-pts ${lead==="p1"?"bright":"dim"}">${tp1}</div><div class="score-label">POINTS</div>${lead==="p1"?`<div class="leading-badge p1">▲ LEADING</div>`:""}</div>
        <div class="vs-col"><div class="vs-line"></div><span class="vs-text">VS</span><div class="vs-line"></div></div>
        <div class="score-col right">${p2NH}<div class="score-pts ${lead==="p2"?"bright":"dim"}">${tp2}</div><div class="score-label">POINTS</div>${lead==="p2"?`<div class="leading-badge p2">▲ LEADING</div>`:""}</div>
      </div>
      ${tot>0?`<div class="pts-bar-wrap"><div class="pts-bar" style="width:${tp1/tot*100}%"></div></div>`:""}
      ${cdHTML}
    </div>
    <div class="tabs">${TABS.map(([t,l])=>`<button class="tab ${S.view===t?"active":"inactive"}" onclick="setView('${t}')">${l}</button>`).join("")}</div>
    ${content}`;
  if(S.editingP){const ni=document.getElementById("ni");if(ni){ni.focus();ni.select();ni.oninput=e=>S._nameInput=e.target.value;ni.onkeydown=e=>{if(e.key==="Enter")saveName();};}}
  renderModals();
}

function renderModals(){

    } else if(!hasFB){

          <div><strong style="color:#E8002D">3.</strong> Left menu → <strong style="color:#fff">Build → Realtime Database</strong></div>

      </div>`;
    } else {
      div.innerHTML=`<div class="modal" style="max-width:360px"><div class="modal-hdr"><span class="modal-title">🔄 SYNC</span><button class="close-btn" onclick="closeSync()">✕</button></div>

      </div>`;

  // Add bet
  if(S.addOpen&&S.addForm){

      ${pickSection(s,S.players,"toggleMP","upd")}

  }

  // Add pick
  if(S.addPickOpen){

    if(b){
      const multi=isMulti(b.catId),c=cat(b.catId),color=side==="p1"?"#E8002D":"#0090FF",cc=side==="p1"?"red":"blue";
      const nm=side==="p1"?S.players.p1:S.players.p2;
      let inp;
      if(multi){
        const sel=S.addPickOpen.multiSel||[],max=c.multi;
        inp=`<div class="multi-pick-section"><div class="multi-pick-header"><span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${color}">Up to ${max}</span><span class="mpc" style="background:${color}22;color:${color};border:1px solid ${color}55">${sel.length}/${max}</span></div><div class="driver-grid">${driverGrid(DRIVERS,sel,max,`tMPModal('${betId}','${side}','${b.catId}',`,cc)}</div></div>`;

      const div=document.createElement("div");div.className="overlay";
      div.innerHTML=`<div class="modal" style="max-width:420px"><div class="modal-hdr"><span class="modal-title" style="color:${color}">${esc(nm)}'s Pick${multi?"s":""}</span><button class="close-btn" onclick="closeAddPick()">✕</button></div>

      </div>`;document.body.appendChild(div);

  // Settle

              <div style="margin-top:8px;font-size:13px">${t.p1?"✓ Correct":"Correct?"}</div>
            </button>
            <button class="settle-opt ${t.p2?"blue":"dim"}" onclick="toggleSettle('p2')" style="border-color:${t.p2?"#0090FF":"#333"};background:${t.p2?"#0090FF22":"transparent"}">
              <div style="font-size:11px;opacity:.7;margin-bottom:6px">${esc(S.players.p2)}</div>

          <button onclick="confirmSettle()" style="margin-top:14px;width:100%;background:#E8002D;border:none;border-radius:8px;color:#fff;padding:12px 0;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit">Confirm</button>
          <button class="void-btn" onclick="settleSingle('push')">Push / Void</button>
        </div>`;
      }
      document.body.appendChild(div);
    }
  }

  // Edit
  if(S.editId&&S.editForm){
    const b=S.bets.find(x=>x.id===S.editId);
    if(b){
      const ef=S.editForm,c=cat(ef.catId),multi=isMulti(ef.catId),sett=isSettled(b);
      const div=document.createElement("div");div.className="overlay";
      div.innerHTML=`<div class="modal"><div class="modal-hdr"><span class="modal-title">✏️ EDIT</span><button class="close-btn" onclick="closeEdit()">✕</button></div>
        ${sett?`<div style="background:#1a1200;border:1px solid #3a2e00;border-radius:6px;padding:8px 12px;font-size:12px;color:#998800;margin-bottom:14px">⚠ Settled — category &amp; race locked</div>`:""}
        <label class="field-lbl">Category</label>${sett?`<div class="field-input" style="opacity:.4">${c.emoji} ${c.label}</div>`:catSelect(ef.catId,"updateEditCat(this.value)")}
        ${c.raceOnly?`<label class="field-lbl">Race</label><select class="field-input" ${sett?"disabled style='opacity:.4'":""} onchange="updE('raceId',this.value)">${RACES.map(r=>`<option value="${r.id}"${ef.raceId===r.id?" selected":""}>${r.date} — ${r.name}</option>`).join("")}</select>`:""}
        ${c.raceOptional?`<label class="field-lbl">Race <span style="color:#444">(optional)</span></label><select class="field-input" onchange="updE('raceId',this.value)"><option value="">— No specific race —</option>${RACES.map(r=>`<option value="${r.id}"${ef.raceId===r.id?" selected":""}>${r.date} — ${r.name}</option>`).join("")}</select>`:""}

        ${pickSection(ef,S.players,"toggleMPE","updE")}
        <label class="field-lbl">${multi?"Pts per Correct Pick":"Points at Stake"}</label>
        <input class="pts-input" type="number" min="1" max="99" value="${ef.pts}" oninput="updE('pts',+this.value)"/>
        <label class="field-lbl">Note <span style="color:#444">(optional)</span></label>

    div.innerHTML=`<div class="modal" style="max-width:400px"><div class="modal-hdr"><span class="modal-title">⚙ SETTINGS</span><button class="close-btn" onclick="closeSettings()">✕</button></div>
      <p style="color:#666;font-size:13px;margin-bottom:16px">Default points per bet type.</p>
      ${CATS.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a1a1a"><span style="font-size:13px;color:#ccc">${c.emoji} ${c.label}${c.ptsPerPick?` <span style="color:#555;font-size:10px">(per✓)</span>`:""}</span><div style="display:flex;align-items:center;gap:8px"><button onclick="adjDef('${c.id}',-1)" style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;color:#aaa;width:28px;height:28px;cursor:pointer;font-size:16px;font-family:inherit">−</button><span style="color:#fff;font-size:16px;font-weight:700;min-width:24px;text-align:center">${S.defaultPts[c.id]||1}</span><button onclick="adjDef('${c.id}',1)" style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;color:#aaa;width:28px;height:28px;cursor:pointer;font-size:16px;font-family:inherit">+</button></div></div>`).join("")}
      <button onclick="resetDefs()" style="margin-top:16px;width:100%;background:none;border:1px solid #2a2a2a;border-radius:7px;color:#555;padding:9px 0;cursor:pointer;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-family:inherit">Reset to Defaults</button>
    </div>`;document.body.appendChild(div);
  }

  // Delete confirm
  if(S.confirmDelId){
    const b=S.bets.find(x=>x.id===S.confirmDelId);
    if(b){
      const c=cat(b.catId);
      const div=document.createElement("div");div.className="overlay";
      div.innerHTML=`<div class="modal" style="max-width:340px;text-align:center">
        <div style="font-size:28px;margin-bottom:12px">🗑️</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px">Delete this bet?</div>
        <div style="font-size:13px;color:#666;margin-bottom:24px">${c.emoji} ${esc(b.description)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button onclick="cancelDel()" style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#aaa;padding:11px 0;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit">Cancel</button>
          <button onclick="confirmDel()" style="background:#E8002D;border:none;border-radius:8px;color:#fff;padding:11px 0;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit">Delete</button>
        </div>
      </div>`;document.body.appendChild(div);
    }
  }

  // Export
  if(S.exportOpen){
    const txt=exportTxt();
    const div=document.createElement("div");div.className="overlay";
    div.innerHTML=`<div class="modal" style="max-width:480px"><div class="modal-hdr"><span class="modal-title">📤 EXPORT</span><button class="close-btn" onclick="closeExport()">✕</button></div>
      <div class="export-box">${esc(txt)}</div>
      <button class="action-btn" id="cpyExBtn" onclick="doCopy()" style="background:#222;border:1px solid #333;color:#fff">Copy to Clipboard</button>
      <button class="action-btn" onclick="doDownload()" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#888">Download .txt</button>
    </div>`;document.body.appendChild(div);
  }
}

// ── Actions ──
function setView(v){S.view=v;render();}
function setRF(v){S.raceFilter=v;render();}
function editName(k){S.editingP=k;S._nameInput=S.players[k];render();}
function saveName(){if(S._nameInput.trim())S.players[S.editingP]=S._nameInput.trim();S.editingP=null;save();render();}
function updText(k,v){if(S.addForm)S.addForm[k]=v;}  // no re-render — fixes keyboard dismiss
function updEText(k,v){if(S.editForm)S.editForm[k]=v;} // no re-render

function openSync(){S.syncOpen=true;renderModals();}
function closeSync(){S.syncOpen=false;renderModals();}
function createRoom(){startSync(genCode());S.syncOpen=true;renderModals();}
function showJoin(){S.syncOpen=false;S.joinOpen=true;renderModals();}
function closeJoin(){S.joinOpen=false;renderModals();}
function doJoin(){const i=document.getElementById("jci"),code=(i?i.value:"").trim().toUpperCase();if(code.length>=4){startSync(code);S.joinOpen=false;S.syncOpen=true;renderModals();}}
function copyCode(){if(!syncRoom)return;navigator.clipboard.writeText(syncRoom).then(()=>{const b=document.getElementById("cpyBtn");if(b){b.textContent="✓ Copied!";b.style.color="#4caf50";setTimeout(()=>{b.textContent="Copy Room Code";b.style.color="#ccc";},2000);}}).catch(()=>{});}

function openSettle(id){S.settlingId=id;S.settlingActual=[];S.settleToggles={p1:false,p2:false};renderModals();}
function closeSettle(){S.settlingId=null;S.settlingActual=[];S.settleToggles=null;renderModals();}
function toggleSettle(side){if(!S.settleToggles)S.settleToggles={p1:false,p2:false};S.settleToggles[side]=!S.settleToggles[side];renderModals();}
function confirmSettle(){const t=S.settleToggles||{p1:false,p2:false};if(!t.p1&&!t.p2){settleSingle('push');return;}S.bets=S.bets.map(b=>b.id===S.settlingId?{...b,result:{p1:!!t.p1,p2:!!t.p2}}:b);S.settlingId=null;S.settlingActual=[];S.settleToggles=null;save();render();}
function tActual(driver){
  const b=S.bets.find(x=>x.id===S.settlingId),max=cat(b.catId).multi,a=S.settlingActual;
  S.settlingActual=a.includes(driver)?a.filter(d=>d!==driver):a.length<max?[...a,driver]:a;renderModals();
}
function settleSingle(r){S.bets=S.bets.map(b=>b.id===S.settlingId?{...b,result:r}:b);S.settlingId=null;S.settlingActual=[];save();render();}
function settleMulti(){
  const b=S.bets.find(x=>x.id===S.settlingId),sc=calcMS(b,S.settlingActual);
  S.bets=S.bets.map(x=>x.id===S.settlingId?{...x,result:{type:"multi",...sc,actual:S.settlingActual}}:x);
  S.settlingId=null;S.settlingActual=[];save();render();
}

function delBet(id){S.confirmDelId=id;renderModals();}
function confirmDel(){S.bets=S.bets.filter(b=>b.id!==S.confirmDelId);S.confirmDelId=null;save();render();}
function cancelDel(){S.confirmDelId=null;renderModals();}

function closeAdd(){S.addOpen=false;renderModals();}
function upd(k,v){S.addForm[k]=v;renderModals();}
function updateCat(catId){S.addForm={...S.addForm,catId,p1Pick:emptyPick(catId),p2Pick:emptyPick(catId),pts:S.defaultPts[catId]||1};renderModals();}
function toggleMP(fk,catId,driver){const max=cat(catId).multi;let a=arr(S.addForm[fk]);a=a.includes(driver)?a.filter(d=>d!==driver):a.length<max?[...a,driver]:a;S.addForm[fk]=a;renderModals();}
function submitBet(){
  const s=S.addForm,c=cat(s.catId),multi=isMulti(s.catId);
  const p1v=multi?arr(s.p1Pick):s.p1Pick,p2v=multi?arr(s.p2Pick):s.p2Pick;
  if(multi?(p1v.length===0&&p2v.length===0):(!p1v&&!p2v))return;
  if(s.catId==="custom"&&!s.customDesc.trim())return;
  const r=(c.raceOnly||(c.raceOptional&&s.raceId))?race(s.raceId):null;
  const desc=s.catId==="custom"?s.customDesc:`${c.label}${r?` · ${r.name}`:""}`;
  S.bets.unshift({id:uid(),catId:s.catId,race:r||null,p1Pick:multi?p1v:(p1v||""),p2Pick:multi?p2v:(p2v||""),description:desc,points:s.pts,ptsPerPick:c.ptsPerPick,result:null,note:s.note||"",ts:Date.now()});
  S.addOpen=false;save();render();
}

function openAddPick(betId,side){const b=S.bets.find(x=>x.id===betId);S.addPickOpen={betId,side,val:"",multiSel:arr(side==="p1"?b.p1Pick:b.p2Pick)};renderModals();}
function closeAddPick(){S.addPickOpen=null;renderModals();}
function tMPModal(betId,side,catId,driver){if(!S.addPickOpen)return;const max=cat(catId).multi;let a=arr(S.addPickOpen.multiSel);a=a.includes(driver)?a.filter(d=>d!==driver):a.length<max?[...a,driver]:a;S.addPickOpen.multiSel=a;renderModals();}
function saveAddPick(){
  const {betId,side}=S.addPickOpen,b=S.bets.find(x=>x.id===betId),multi=isMulti(b.catId);
  const nv=multi?S.addPickOpen.multiSel:S.addPickOpen.val;
  if(multi?nv.length===0:(!nv||!String(nv).trim()))return;
  S.bets=S.bets.map(x=>x.id===betId?{...x,[side==="p1"?"p1Pick":"p2Pick"]:nv}:x);
  S.addPickOpen=null;save();render();
}

function openEdit(id){
  const b=S.bets.find(x=>x.id===id);if(!b)return;
  const multi=isMulti(b.catId);
  S.editId=id;S.editForm={catId:b.catId,raceId:b.race?b.race.id:"aus",p1Pick:multi?arr(b.p1Pick):(b.p1Pick||""),p2Pick:multi?arr(b.p2Pick):(b.p2Pick||""),customDesc:b.catId==="custom"?b.description:"",pts:b.points,note:b.note||""};renderModals();
}
function closeEdit(){S.editId=null;S.editForm=null;renderModals();}
function updE(k,v){if(S.editForm)S.editForm[k]=v;renderModals();}
function updateEditCat(catId){if(!S.editForm)return;S.editForm={...S.editForm,catId,p1Pick:emptyPick(catId),p2Pick:emptyPick(catId)};renderModals();}
function toggleMPE(fk,catId,driver){if(!S.editForm)return;const max=cat(catId).multi;let a=arr(S.editForm[fk]);a=a.includes(driver)?a.filter(d=>d!==driver):a.length<max?[...a,driver]:a;S.editForm[fk]=a;renderModals();}
function saveEdit(){
  const ef=S.editForm,id=S.editId,b=S.bets.find(x=>x.id===id);if(!ef||!b)return;
  const c=cat(ef.catId),multi=isMulti(ef.catId);
  const r=(c.raceOnly||(c.raceOptional&&ef.raceId))?race(ef.raceId):null;
  const desc=ef.catId==="custom"?ef.customDesc:`${c.label}${r?` · ${r.name}`:""}`;
  S.bets=S.bets.map(x=>x.id===id?{...x,catId:ef.catId,race:r||null,p1Pick:multi?arr(ef.p1Pick):(ef.p1Pick||""),p2Pick:multi?arr(ef.p2Pick):(ef.p2Pick||""),description:desc,points:ef.pts,ptsPerPick:c.ptsPerPick,note:ef.note||""}:x);
  S.editId=null;S.editForm=null;save();render();
}

function openSettings(){S.settingsOpen=true;renderModals();}
function closeSettings(){S.settingsOpen=false;renderModals();}
function adjDef(id,d){
  const modal=document.querySelector(".overlay .modal");
  const scrollTop=modal?modal.scrollTop:0;
  S.defaultPts[id]=Math.max(1,Math.min(99,(S.defaultPts[id]||1)+d));save();renderModals();
  const newModal=document.querySelector(".overlay .modal");
  if(newModal)newModal.scrollTop=scrollTop;
}
function resetDefs(){S.defaultPts={...DEF_PTS};save();renderModals();}

function openExport(){S.exportOpen=true;renderModals();}
function closeExport(){S.exportOpen=false;renderModals();}
function doCopy(){navigator.clipboard.writeText(exportTxt()).then(()=>{const b=document.getElementById("cpyExBtn");if(b){b.textContent="✓ Copied!";b.style.background="#1a3a1a";b.style.color="#4caf50";setTimeout(()=>{b.textContent="Copy to Clipboard";b.style.background="#222";b.style.color="#fff";},2000);}}).catch(()=>{});}
function doDownload(){const a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(exportTxt());a.download="f1-bets-2026.txt";a.click();}

document.getElementById("fab").onclick=()=>{
  const catId="race_winner";
  S.addForm={catId,raceId:"aus",p1Pick:emptyPick(catId),p2Pick:emptyPick(catId),customDesc:"",pts:S.defaultPts[catId],note:""};
  S.addOpen=true;renderModals();
};

setInterval(()=>{
  const nr=nextRace();if(!nr)return;
  const cd=fmtCd(nr.ts-Date.now());
  [["cd-d",cd.d],["cd-h",p2(cd.h)],["cd-m",p2(cd.m)],["cd-s",p2(cd.s)]].forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.textContent=v;});
},1000);

load();render();
</script>
